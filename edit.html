<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit transaction | FinTrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">F</span> FinTrack</a>
        <a class="back-link" href="{{ url_for('index') }}">Back to overview</a>
    </header>
    <main class="page-wrap edit-page">
        <section class="page-heading">
            <div>
                <p class="eyebrow">YOUR ACTIVITY</p>
                <h1>Edit transaction</h1>
                <p class="subheading">Update the details below.</p>
            </div>
        </section>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="messages" role="status">
                    {% for category_name, message in messages %}<p class="message message-{{ category_name }}">{{ message }}</p>{% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        <form class="transaction-form edit-form" method="post" action="{{ url_for('edit_transaction', transaction_id=transaction_id) }}">
            <label>Type
                <select name="kind" required>
                    <option value="expense" {% if transaction['kind'] == 'expense' %}selected{% endif %}>Expense</option>
                    <option value="income" {% if transaction['kind'] == 'income' %}selected{% endif %}>Income</option>
                </select>
            </label>
            <label>Amount
                <input type="number" name="amount" min="0.01" step="0.01" value="{{ transaction['amount'] }}" required>
            </label>
            <label>Category
                <select name="category" required>
                    {% for item in categories %}<option value="{{ item }}" {% if transaction['category'] == item %}selected{% endif %}>{{ item }}</option>{% endfor %}
                </select>
            </label>
            <label>Date
                <input type="date" name="transaction_date" value="{{ transaction['transaction_date'] }}" required>
            </label>
            <label class="note-field">Note <span class="optional">(optional)</span>
                <input type="text" name="note" maxlength="120" value="{{ transaction['note'] }}">
            </label>
            <div class="form-actions">
                <button class="button button-dark" type="submit">Save changes</button>
                <a class="button button-outline" href="{{ url_for('index') }}">Cancel</a>
            </div>
        </form>
    </main>
</body>
</html>
